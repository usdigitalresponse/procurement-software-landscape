<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: "Procurement Software Landscape" }} | Procurement Software Landscape</title>
<meta name="description" content="How each public solicitation website in the Procurement Software Landscape is scored.">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Procurement Software Landscape">
<meta property="og:title" content="{{ page.title | default: 'Procurement Software Landscape' }}">
<meta property="og:description" content="How each public solicitation website in the Procurement Software Landscape is scored.">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/preview.png' | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Procurement Software Landscape (Beta): How easy is it to find and use public bid notices? Each state, territory and DC procurement website, scored out of 100 points.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600&display=swap">
<style>
  :root {
    --ink: #101828; --muted: #565c65; --line: #dfe1e2; --panel: #f6f7f8;
    --accent: #006bc9; --accent-dark: #143464; --button: #0066ff; --sky: #ddeffc;
    --heading: Lora, Georgia, serif;
    --gutter: max(1rem, calc((100% - 78rem) / 2));
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fff; }
  a { color: var(--accent); }
  a:hover { color: var(--accent-dark); }
  :focus-visible { outline: 3px solid #2491ff; outline-offset: 2px; }
  .skip { position: absolute; left: -9999px; }
  .skip:focus { left: 1rem; top: 1rem; background: #fff; padding: .5rem; z-index: 10; }
  .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 2rem; padding: .875rem var(--gutter); border-bottom: 1px solid var(--line); }
  .brand img { display: block; height: 32px; width: auto; }
  .beta { display: inline-block; padding: .1rem .5rem; border-radius: .25rem; background: var(--accent-dark); color: #fff; font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; line-height: 1.4; }
  .site-nav { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem 1.5rem; margin: 0; padding: 0; list-style: none; font-size: .95rem; font-weight: 500; }
  .site-nav a { color: var(--ink); text-decoration: none; border-bottom: 2px solid transparent; padding-bottom: .1rem; }
  .site-nav a:hover { color: var(--button); }
  .site-nav a[aria-current="page"] { font-weight: 700; border-bottom-color: var(--button); }
  main { max-width: 48rem; margin: 0 auto; padding: 1.5rem 1rem; }
  main h1 { font-family: var(--heading); font-weight: 600; font-size: 2rem; line-height: 1.25; color: var(--accent-dark); margin: 0 0 1rem; }
  main h3 { font-family: var(--heading); font-weight: 600; font-size: 1.3rem; color: var(--accent-dark); margin: 2.25rem 0 .5rem; padding-top: 1rem; border-top: 1px solid var(--line); }
  main h3:target { background: #fff5c2; }
  code { background: var(--panel); padding: .1rem .3rem; border-radius: .2rem; font-size: .9em; word-break: break-word; }
  footer { margin-top: 2.5rem; padding: 1.75rem var(--gutter) 1.25rem; background: var(--accent-dark); color: #fff; font-size: .875rem; }
  footer p { margin: 0 0 .5rem; }
  footer a { color: #fff; }
  footer a:hover { color: var(--sky); }
  footer :focus-visible { outline-color: #fff; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
  <nav class="topbar" aria-label="Site">
    <a class="brand" href="https://www.usdigitalresponse.org/"><img src="{{ '/assets/usdr-logo.svg' | relative_url }}" alt="U.S. Digital Response" width="101" height="32"></a>
    <ul class="site-nav">
      <li><a href="{{ '/' | relative_url }}">Landscape</a></li>
      <li><a href="{{ '/Scoring-Metrics.html' | relative_url }}"{% if page.url == '/Scoring-Metrics.html' %} aria-current="page"{% endif %}>Scoring metrics</a></li>
      <li><a href="https://github.com/usdigitalresponse/procurement-software-landscape">GitHub</a></li>
      <li><span class="beta">Beta</span></li>
    </ul>
  </nav>
</header>

<main id="main">
{{ content }}
</main>

<footer>
  <p>A <a href="https://www.usdigitalresponse.org/">U.S. Digital Response</a> project. <a href="{{ '/' | relative_url }}">Back to the landscape</a>.</p>
  <p>See something wrong? <a href="https://github.com/usdigitalresponse/procurement-software-landscape/issues/new">Report a correction on GitHub</a>.</p>
</footer>
</body>
</html>
